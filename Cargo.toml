[workspace]
members = ["compression", "font", "image", "net", "renderer", "utils"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
compression = { package = "clairo-compression", path = "compression" }
font = { package = "clairo-font", path = "font" }
net = { package = "clairo-net", path = "net" }
utils = { package = "clairo-utils", path = "utils" }
image = { package = "clairo-image", path = "image" }
